name: Keel scheduler

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Drain retry queues, deliver outbox, send daily report when due
        env:
          RAW_SECRET: ${{ secrets.KEEL_CRON_SECRET }}
          RAW_URL: ${{ secrets.KEEL_API_URL }}
        run: |
          SECRET=$(printf '%s' "$RAW_SECRET" | tr -d '[:space:]')
          SECRET=${SECRET#KEEL_CRON_SECRET=}
          URL=$(printf '%s' "$RAW_URL" | tr -d '[:space:]')
          URL=${URL#KEEL_API_URL=}
          curl -fsS --retry 3 --retry-delay 10 --max-time 120 \
            -H "Authorization: Bearer ${SECRET}" \
            "${URL%/}/api/cron/tick"
